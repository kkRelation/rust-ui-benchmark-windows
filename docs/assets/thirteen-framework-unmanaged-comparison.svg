<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title description">
  <title id="title">Corrected unmanaged-window comparison of thirteen Rust UI frameworks</title>
  <desc id="description">Three-round median resource usage and warm window latency. Red values are overall minima. Blue values beat gpui-fast without being the overall minimum.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #e6edf3; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #9da7b3; }
    .header { font-size: 14px; font-weight: 700; fill: #f0f6fc; }
    .framework { font-size: 14px; font-weight: 600; }
    .value { font-size: 14px; font-variant-numeric: tabular-nums; }
    .best { fill: #ff6b6b; font-weight: 700; }
    .better { fill: #58a6ff; font-weight: 700; }
    .baseline { fill: #79c0ff; font-weight: 700; }
    .grid { stroke: #30363d; stroke-width: 1; }
  </style>

  <rect width="1500" height="800" rx="14" fill="#0d1117"/>
  <text class="title" x="28" y="40">Corrected Unmanaged-Window Comparison</text>
  <text class="subtitle" x="28" y="66">Lower is better · Three-round release medians · gpui-fast is the comparison baseline</text>
  <text class="subtitle" x="28" y="94">
    <tspan class="best">Red</tspan><tspan> = overall minimum (ties included)   ·   </tspan>
    <tspan class="better">Blue</tspan><tspan> = lower than gpui-fast, but not the overall minimum</tspan>
  </text>

  <rect x="24" y="116" width="1452" height="620" rx="8" fill="#0b1016" stroke="#30363d"/>
  <rect x="24" y="116" width="1452" height="48" rx="8" fill="#161b22"/>
  <rect x="24" y="208" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="296" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="384" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="472" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="560" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="648" width="1452" height="44" fill="#0f141b"/>
  <rect x="24" y="692" width="1452" height="44" fill="#102a43"/>

  <path class="grid" d="M390 116V736 M570 116V736 M750 116V736 M930 116V736 M1110 116V736"/>
  <path class="grid" d="M24 164H1476 M24 208H1476 M24 252H1476 M24 296H1476 M24 340H1476 M24 384H1476 M24 428H1476 M24 472H1476 M24 516H1476 M24 560H1476 M24 604H1476 M24 648H1476 M24 692H1476 M24 736H1476"/>

  <text class="header" x="44" y="146">Framework</text>
  <text class="header" x="480" y="146" text-anchor="middle">Hidden PWS (MB)</text>
  <text class="header" x="660" y="146" text-anchor="middle">Workload PWS (MB)</text>
  <text class="header" x="840" y="146" text-anchor="middle">Workload CPU (%)</text>
  <text class="header" x="1020" y="146" text-anchor="middle">GPU Average (%)</text>
  <text class="header" x="1293" y="146" text-anchor="middle">Warm Show / Hide (ms)</text>

