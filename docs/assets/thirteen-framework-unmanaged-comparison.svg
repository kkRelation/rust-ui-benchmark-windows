    <text x="480" y="632" text-anchor="middle">45.7</text>
    <text x="660" y="632" text-anchor="middle">54.4</text>
    <text x="840" y="632" text-anchor="middle">0.329</text>
    <text class="better" x="1020" y="632" text-anchor="middle">0.632</text>
    <text x="1293" y="632" text-anchor="middle"><tspan class="better">297.982</tspan><tspan> / </tspan><tspan class="better">244.843</tspan></text>

    <text class="framework" x="44" y="676">egui</text>
    <text x="480" y="676" text-anchor="middle">184.9</text>
    <text x="660" y="676" text-anchor="middle">189.0</text>
