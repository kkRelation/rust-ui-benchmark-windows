    <text x="840" y="588" text-anchor="middle">0.328</text>
    <text x="1020" y="588" text-anchor="middle">1.022</text>
    <text x="1293" y="588" text-anchor="middle"><tspan class="better">224.070</tspan><tspan> / </tspan><tspan class="better">234.086</tspan></text>

