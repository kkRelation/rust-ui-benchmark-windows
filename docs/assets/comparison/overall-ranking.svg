<text class="sub" x="28" y="67">Arithmetic mean of RAM, CPU, GPU activity, dedicated VRAM, warm show and warm hide percentile rank scores.</text>
<text class="sub" x="28" y="91">The weakness floor is the lowest of the six axis scores; radar polygon area is intentionally not used for ranking.</text>
