<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="718" viewBox="0 0 1100 718" role="img" aria-labelledby="title desc">
<title id="title">Equal-weight composite ranking</title><desc id="desc">The arithmetic mean of six cohort-relative percentile rank scores.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#e6edf3}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#9da7b3}.name{font-size:14px;font-weight:600}.score{font-size:13px;font-weight:700}.floor{font-size:12px;fill:#9da7b3}</style>
