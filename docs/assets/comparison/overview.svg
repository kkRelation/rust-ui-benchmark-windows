<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="810" viewBox="0 0 1740 810" role="img" aria-labelledby="title description">
<title id="title">Corrected unmanaged-window comparison of thirteen Rust UI frameworks</title>
<desc id="description">Three-round median resource usage, dedicated and shared GPU memory peaks, and warm window latency. Red values are overall minima. Blue values beat gpui-fast without being the overall minimum.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#e6edf3}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#9da7b3}.header{font-size:13px;font-weight:700;fill:#f0f6fc}.framework{font-size:14px;font-weight:600}.value{font-size:14px;font-variant-numeric:tabular-nums}.best{fill:#ff6b6b;font-weight:700}.better{fill:#58a6ff;font-weight:700}.baseline{fill:#79c0ff;font-weight:700}.grid{stroke:#30363d;stroke-width:1}</style>
