[package]
name = "komorebi-iced-framework-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["tokio"] }
serde_json = "1"
ui-bench-protocol = { path = "../probe-protocol" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
