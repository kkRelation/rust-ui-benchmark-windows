<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Framework Bench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #080b10; color: #c9d1d9; font-family: "Segoe UI", sans-serif; }
      .main { height: 100%; padding: 18px; background: #0d1117; }
      .masthead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      h1 { margin: 0; color: #f0f6fc; font-size: 25px; }
      .badge { padding: 8px 16px; border-radius: 99px; color: #79c0ff; background: #1f6feb33; font-size: 11px; font-weight: 700; }
      .search { height: 54px; padding: 8px 16px; border: 1px solid #30363d; border-radius: 12px; background: #161b22; }
      .search small, .muted { display: block; margin-top: 3px; color: #8b949e; font-size: 11px; }
      .list { height: calc(100% - 108px); margin-top: 12px; overflow: auto; border: 1px solid #30363d; border-radius: 12px; }
      .shortcut-row { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-bottom: 1px solid #21262d; }
      .shortcut-row:nth-child(even) { background: #11161c; }
      .shortcut-row.selected { border-left: 4px solid #58a6ff; background: #1f6feb44; }
      .shortcut { width: 128px; color: #f0f6fc; font-size: 13px; font-weight: 700; }
      .description { width: 360px; font-size: 13px; }
      .section { margin-left: auto; color: #8b949e; font-size: 12px; }
      .aux { height: 100%; padding: 22px 24px; }
      .panel { border: 1px solid #30363d; border-radius: 16px; background: #161b22; }
      .preview { height: 114px; padding: 16px 20px; }
      .eyebrow { color: #79c0ff; font-size: 13px; font-weight: 700; }
      .preview h2 { margin: 8px 0 0; color: #f0f6fc; font-size: 18px; }
      .aux-body { display: flex; gap: 18px; height: 560px; margin-top: 18px; }
      .atlas { width: 854px; padding: 18px 22px; background: #0d1117; }
      .atlas h3 { margin: 0 0 16px; color: #f0f6fc; font-size: 16px; }
      .keys { display: grid; grid-template-columns: repeat(11, 1fr); gap: 10px; }
      .key { display: grid; height: 42px; place-items: center; border: 1px solid #30363d; border-radius: 8px; background: #21262d; font-size: 12px; font-weight: 700; }
      .key.selected { color: white; border-color: #79c0ff; background: #2f81f7; }
      .side { display: flex; width: 266px; flex-direction: column; gap: 18px; }
      .side-panel { min-height: 162px; padding: 15px 18px; }
      .large { margin: 14px 0; color: #f0f6fc; font-size: 21px; font-weight: 700; }
      .medium { margin: 9px 0; color: #f0f6fc; font-size: 18px; }
      .detail { margin: 8px 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const view = params.get("view");
      const app = document.querySelector("#app");
      let selected = 0;

      const row = (index) => `<div class="shortcut-row${index === selected ? " selected" : ""}" data-index="${index}"><span class="shortcut">u${index % 3}+${String.fromCharCode(97 + index % 26)}</span><span class="description">Representative shortcut action ${String(index + 1).padStart(2, "0")}</span><span class="section">${["Focus", "Move", "Stack", "Layout", "Workspace", "System"][index % 6]}</span></div>`;
      const key = (index) => `<div class="key${index === selected % 66 ? " selected" : ""}" data-index="${index}">${index < 26 ? String.fromCharCode(65 + index) : `K${String(index + 1).padStart(2, "0")}`}</div>`;

      if (view === "main") {
        app.innerHTML = `<main class="main"><div class="masthead"><h1>Shortcut Palette</h1><span class="badge">72 ENTRIES</span></div><div class="search">Search shortcuts, commands, facets, and object memory<small>Static benchmark corpus · selection drives the auxiliary canvas</small></div><div class="list">${Array.from({ length: 72 }, (_, index) => row(index)).join("")}</div></main>`;
      } else {
        app.innerHTML = `<main class="aux"><section class="preview panel"><div class="eyebrow">Object Memory Preview</div><h2 id="preview-title">Selected action 1: move, focus, or transform the active object</h2><small class="muted">Representative defining expression, scenario annotation, availability note, source path, and extended explanation.</small></section><div class="aux-body"><section class="atlas panel"><h3>Binding Atlas · modifier plane and related bindings</h3><div class="keys">${Array.from({ length: 66 }, (_, index) => key(index)).join("")}</div></section><aside class="side"><section class="side-panel panel"><div class="eyebrow">Navigation</div><div class="large">H&nbsp; J&nbsp; K&nbsp; L</div><small class="muted">word · line · page · history</small><small class="muted" id="relation">selected relation 0</small></section><section class="side-panel panel"><div class="eyebrow">Numpad / Operations</div><div class="medium">7&nbsp;&nbsp; 8&nbsp;&nbsp; 9&nbsp;&nbsp; +</div><div class="medium">4&nbsp;&nbsp; 5&nbsp;&nbsp; 6&nbsp;&nbsp; -</div><div class="medium">1&nbsp;&nbsp; 2&nbsp;&nbsp; 3&nbsp;&nbsp; Enter</div></section><section class="side-panel panel"><div class="eyebrow">Dossier</div><div class="detail">Provider&nbsp;&nbsp;&nbsp;&nbsp; kanata</div><div class="detail">Family&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; komorebi</div><div class="detail">Target&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; window</div><div class="detail">Applicability available</div><small class="muted" id="generation">Generation&nbsp;&nbsp;&nbsp; 0</small></section></aside></div></main>`;
      }

      function renderSelection(next) {
        selected = next;
        document.querySelectorAll(".selected").forEach((node) => node.classList.remove("selected"));
        if (view === "main") {
          document.querySelector(`[data-index="${selected}"]`).classList.add("selected");
        } else {
          document.querySelector(`[data-index="${selected % 66}"]`).classList.add("selected");
          document.querySelector("#preview-title").textContent = `Selected action ${selected + 1}: move, focus, or transform the active object`;
          document.querySelector("#relation").textContent = `selected relation ${selected % 12}`;
          document.querySelector("#generation").textContent = `Generation   ${selected}`;
        }
      }

      window.__TAURI__.event.listen("bench-selection", (event) => {
        renderSelection(event.payload);
      });
    </script>
  </body>
</html>
