[package]
name = "komorebi-dioxus-native-framework-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
blitz-shell = { git = "https://github.com/dioxuslabs/blitz", rev = "fe33b778baaef5375d941c8a4f491f62cbd31d30", default-features = false }
dioxus = "=0.8.0-alpha.3"
dioxus-native = { git = "https://github.com/dioxuslabs/blitz", rev = "fe33b778baaef5375d941c8a4f491f62cbd31d30", default-features = false, features = ["prelude", "vello-hybrid", "system-fonts"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
ui-bench-protocol = { path = "../probe-protocol" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
